[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-purpose-annotator"
version = "1.1.0"
description = "Explain declared dependencies from observable imports and flag apparently unused packages."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "tomli>=2.0"]

[project.scripts]
dependency-purpose = "dependency_purpose_annotator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
omit = ["src/*/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dependency_purpose_annotator --cov-branch --cov-report=term-missing --cov-fail-under=90"
